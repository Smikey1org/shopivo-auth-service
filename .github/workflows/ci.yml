name: Shopivo-Auth-Service

on:
  push:
    branches:
      - qa
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

# Default: minimum permissions
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service

# ============================================================
# SECURITY
# ============================================================

jobs:
  # ----------------------------------------------------------
  # GITLEAKS
  # ----------------------------------------------------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          archive: false

  # ----------------------------------------------------------
  # CHECKOV
  # ----------------------------------------------------------
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Terraform
        run: |
          checkov \
            -d . \
            --framework terraform \
            --output json \
            > checkov-terraform-report.json

      - name: Checkov Kubernetes
        run: |
          checkov \
            -d . \
            --framework kubernetes \
            --output json \
            > checkov-k8s-report.json
      - name: Checkov Dockerfile
        run: |
          checkov \
            -d . \
            --skip-check CKV_DOCKER_2 \
            --framework dockerfile \
            --output json \
            > checkov-dockerfile-report.json
        # TODO 1:  On Line 100, its making `CKV_DOCKER_2` to skip Health Check ci pipeline.
        # checkov:skip=CKV_DOCKER_2:Healthcheck is managed by the deployment platform

      - name: Upload Checkov Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-reports
          path: |
            checkov-terraform-report.json
            checkov-k8s-report.json
            checkov-dockerfile-report.json
          if-no-files-found: warn
          archive: true

  # ----------------------------------------------------------
  # TRIVY FILESYSTEM
  # ----------------------------------------------------------
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true

      - name: Trivy Vulnerability Scan
        run: |
          trivy fs . \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-fs-report.json \
            --exit-code 1

      - name: Generate CycloneDX SBOM
        if: always()
        run: |
          trivy fs . \
            --format cyclonedx \
            --output trivy-fs-sbom-cyclonedx.json \
            --exit-code 0

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-reports
          path: |
            trivy-fs-report.json
            trivy-fs-sbom-cyclonedx.json
          if-no-files-found: warn
          archive: true

  # ============================================================
  # QUALITY
  # ============================================================

  # ----------------------------------------------------------
  # LINT
  # ----------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

  # ----------------------------------------------------------
  # TEST
  # ----------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --if-present

      - name: Run Tests
        run: npm test --if-present

  # ----------------------------------------------------------
  # SONARQUBE
  # ----------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # APPLICATION BUILD
  # ============================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - checkov
      - trivy
      - lint
      - test
      - sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --if-present

      - name: Build Application
        run: npm run build --if-present

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: |
            dist/
            prisma/
            package.json
            package-lock.json
          if-no-files-found: warn
          archive: true

  # ============================================================
  # DOCKER
  # ============================================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------
      # IMAGE TAG
      # ---------------------------------------------
      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

      # ---------------------------------------------
      # DOCKER LOGIN
      # ---------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ---------------------------------------------
      # BUILDX
      # ---------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------
      # BUILD IMAGE
      # ---------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------
      # TRIVY IMAGE SCAN
      # ---------------------------------------------
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true

      - name: Scan Docker Image
        run: |
          trivy image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ---------------------------------------------
      # IMAGE SBOM
      # ---------------------------------------------
      - name: Generate Image SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output image-sbom-cyclonedx.json \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Image SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-sbom
          path: image-sbom-cyclonedx.json
          if-no-files-found: warn
          archive: false

      # ---------------------------------------------
      # PUSH IMAGE
      # ---------------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
