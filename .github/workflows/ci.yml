name: Shopivo-Auth-Service
on:
  push:
    branches:
      - qa
    paths:
      - src/**
      - tests/**
      - prisma/**
      - .github/workflows/ci.yml

permissions:
  contents: write
  id-token: write

jobs:
  gitleaks-scan:
    name: Git-Leaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          archive: false

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Terraform scan
        run: checkov -d . --framework terraform --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v7
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn
          archive: false

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Kubernetes Scan
        run: checkov -d . --framework kubernetes --output json > checkov-k8s-report.json || true
      - name: Upload Checkov K8s Report
        uses: actions/upload-artifact@v7
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
          archive: false

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile Scan
        run: checkov -d . --framework Dockerfile --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn
          archive: false

  trivy-fs-scan:
    name: Trivy File System Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true
      - name: Run Trivy FS Scan (JSON)
        run: |
          trivy fs . \
          --ignore-unfixed \
          --severity HIGH,CRITICAL \
          --format json \
          --output shopivo-auth-service-trivy-fs-report.json \
          --exit-code 0
      - name: Run Trivy FS Scan (TABLE/TXT)
        run: |
          trivy fs . \
          --ignore-unfixed \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 0 > shopivo-auth-service-trivy-fs-report.txt
      - name: Generate SBOM Trivy FS Scan (Cyclonedx)
        run: |
          trivy fs . \
          --format cyclonedx \
          --exit-code 0 > shopivo-auth-service-sbom-cyclonedx-trivy-fs-report.json
      - name: Generate SBOM Trivy FS Scan (SPDX Json)
        run: |
          trivy fs . \
          --format spdx-json \
          --exit-code 0 > shopivo-auth-service-sbom-spdx-trivy-fs-report.json
      - name: Upload Trivy FS JSON Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-trivy-fs-report-json
          path: shopivo-auth-service-trivy-fs-report.json
          if-no-files-found: warn
          archive: false
      - name: Upload Trivy FS TABLE/TXT Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-trivy-fs-report-txt
          path: shopivo-auth-service-trivy-fs-report.txt
          if-no-files-found: warn
          archive: false
      - name: Upload Trivy FS JSON Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-sbom-cyclonedx-trivy-fs-report
          path: shopivo-auth-service-sbom-cyclonedx-trivy-fs-report.json
          if-no-files-found: warn
          archive: false
      - name: Upload Trivy FS TABLE/TXT Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-sbom-spdx-trivy-fs-report
          path: shopivo-auth-service-sbom-spdx-trivy-fs-report.json
          if-no-files-found: warn
          archive: false

  lint:
    name: Check Lint
    runs-on: ubuntu-latest
    needs:
      - gitleaks-scan
      - checkov-terraform
      - checkov-k8s
      - checkov-dockerfile
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint --if-present

  test:
    name: Check Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Test
        run: npm test --if-present
        continue-on-error: true

  sonarqube:
    name: SonarQube Analysis and Quality Gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # Default: 1
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Optional:
          # The URL of the SonarQube Server. This is required for self-hosted SonarQube Server but not needed for SonarQube Cloud.
          # SONAR_HOST_URL: 123.123.123.123:9000
      # Check the Quality Gate status.
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        # The possible outputs of the `quality-gate-status` variable are `PASSED`, `WARN` or `FAILED`.
      - name: "SonarQube Quality Gate Status Result"
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma
        run: npm run prisma:generate --if-present
      - name: Build project
        run: npm run build --if-present

  docker:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Shortern Github Commit SHA
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
          echo "COMMIT_ID=${GITHUB_SHA::6}"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

        # sets up QEMU emulation on your GitHub Actions runner
        # so Docker can build or run images for architectures different
        # from the runner's native architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:${{ env.COMMIT_ID }}
            ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:latest

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true

      - name: Generate SBOM Trivy Image Scan (Cyclonedx)
        run: |
          trivy image ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:${{ env.COMMIT_ID }} \
          --format cyclonedx \
          --exit-code 0 > shopivo-auth-service-sbom-cyclonedx-trivy-image-report.json
      - name: Generate SBOM Trivy Image Scan (SPDX Json)
        run: |
          trivy image ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:${{ env.COMMIT_ID }} \
          --format spdx-json \
          --exit-code 0 > shopivo-auth-service-sbom-spdx-trivy-image-report.json

      - name: Upload Trivy Image Cyclonedx Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-sbom-cyclonedx-trivy-image-report
          path: shopivo-auth-service-sbom-cyclonedx-trivy-image-report.json
          if-no-files-found: warn
          archive: false
      - name: Upload Trivy Image SPDX-Json Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopivo-auth-service-sbom-spdx-trivy-image-report
          path: shopivo-auth-service-sbom-spdx-trivy-image-report.json
          if-no-files-found: warn
          archive: false
      - name: Docker Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:${{ env.COMMIT_ID }}
            ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-auth-service:latest
